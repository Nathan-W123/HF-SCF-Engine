[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reentry"
version = "1.0.0"
description = "Physically grounded 3-DOF hypersonic atmospheric reentry simulator"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "validation", "scripts"]
addopts = "-q --durations=10"
filterwarnings = [
    "ignore::DeprecationWarning",
]
